name: Phase 2 — Rule Extraction (Collect)

on:
  workflow_dispatch:
  schedule:
    # Poll hourly; script exits early if batches are not yet complete
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: phase-2-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Collect Phase 2 extraction results
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/extract_rules.py collect

      - name: Push committed changes
        run: |
          # Pull latest in case of concurrent runs, then push
          git pull --rebase origin HEAD || true
          git push origin HEAD
