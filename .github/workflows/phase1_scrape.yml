name: Phase 1 — Markdown Clone

on:
  workflow_dispatch:
  schedule:
    # Run at midnight on the 1st of every month (~30-day cadence)
    - cron: '0 0 1 * *'

permissions:
  contents: write

concurrency:
  group: phase-1-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run Phase 1 — scrape Style Manual
        env:
          SITEMAP_URL: ${{ secrets.SITEMAP_URL }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: python src/scrape.py

      - name: Push committed changes
        run: git push origin HEAD
