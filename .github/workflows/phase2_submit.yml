name: Phase 2 — Rule Extraction (Submit)

# Manual dispatch only. This job submits an OpenAI Batch API request, which
# costs tokens — auto-chaining from Phase 1 is deliberately disabled so that
# batch submissions only happen when the repo owner explicitly approves them.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: phase-2-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Enable collect workflow to begin polling
        run: gh workflow enable phase2_collect.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit Phase 2 extraction batches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/extract_rules.py submit

      - name: Push committed changes
        run: git push origin HEAD
