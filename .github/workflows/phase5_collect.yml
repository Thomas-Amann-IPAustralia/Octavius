name: Phase 5 — Correct Erroneous Rules (Collect)

on:
  workflow_dispatch:
  schedule:
    # Poll hourly; script exits early if batches are not yet complete
    - cron: '30 * * * *'

permissions:
  contents: write

concurrency:
  group: phase-5-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Collect Phase 5 correction results and re-test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/correct_rules.py collect

      - name: Upload post-correction test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-correction-test-report-${{ github.run_id }}
          path: test_report.md
          retention-days: 30

      - name: Push committed changes
        run: |
          git pull --rebase origin HEAD || true
          git push origin HEAD
