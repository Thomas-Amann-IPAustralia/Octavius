name: Phase 3 — Generate Rules as Code (Submit)

# Manual dispatch only. This job submits an OpenAI Batch API request, which
# costs tokens — auto-chaining from Phase 2 collect is deliberately disabled
# so batch submissions only happen when the repo owner explicitly approves
# them. The script itself checks whether Phase 2 collect has finished
# (batch_state.json empty) and exits gracefully if not.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: phase-3-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Enable collect workflow to begin polling
        run: gh workflow enable phase3_collect.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit Phase 3 code generation batches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_UNASSIGNED_RATIO: ${{ vars.MAX_UNASSIGNED_RATIO || '0.05' }}
        run: python src/generate_code.py submit

      - name: Push committed changes
        run: git push origin HEAD
