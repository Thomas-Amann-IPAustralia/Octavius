name: Phase 3.5 — Feature Authoring (Collect)

on:
  workflow_dispatch:
  schedule:
    # Poll hourly; script exits early if batches are not yet complete
    - cron: '45 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: phase-3-5-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Collect Phase 3.5 feature-authoring results
        id: collect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/extract_features.py collect

      - name: Push committed changes
        run: |
          git pull --rebase origin HEAD || true
          git push origin HEAD

      - name: Disable collect schedule after successful retrieval
        if: steps.collect.outputs.collected == 'true'
        run: gh workflow disable phase3_5_collect.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
