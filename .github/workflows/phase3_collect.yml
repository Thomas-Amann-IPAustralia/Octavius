name: Phase 3 — Generate Rules as Code (Collect)

on:
  workflow_dispatch:
  schedule:
    # Poll hourly; script exits early if batches are not yet complete
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: phase-3-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Collect Phase 3 code generation results
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/generate_code.py collect

      - name: Push committed changes
        run: |
          git pull --rebase origin HEAD || true
          git push origin HEAD
