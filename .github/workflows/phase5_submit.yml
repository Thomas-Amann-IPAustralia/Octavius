name: Phase 5 — Correct Erroneous Rules (Submit)

# Manual dispatch only. This job submits an OpenAI Batch API request, which
# costs tokens — auto-chaining from Phase 4 is deliberately disabled so that
# batch submissions only happen when the repo owner explicitly approves them.
# The script itself checks whether any test_result: fail rows exist and
# exits gracefully if there is nothing to correct.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-5-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Submit Phase 5 correction batches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/correct_rules.py submit

      - name: Push committed changes
        run: git push origin HEAD
