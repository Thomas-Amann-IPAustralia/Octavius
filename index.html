<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octavius — Plain Language Linter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.125rem;
      color: #7c3aed;
    }

    .logo svg { width: 24px; height: 24px; }

    .stats {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .stat-chip.error   { background: #fff1f2; color: #e11d48; }
    .stat-chip.warning { background: #fffbeb; color: #d97706; }
    .stat-chip.info    { background: #f5f3ff; color: #7c3aed; }

    .status {
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #e2e8f0;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main layout ────────────────────────────────────────────────── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Editor pane ────────────────────────────────────────────────── */
    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .editor-container {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #fff;
    }

    .editor-backdrop {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 1rem 1.25rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.75;
      font-size: 0.875rem;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #1e293b;
      overflow-y: auto;
      pointer-events: none;
    }

    .editor-textarea {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 1rem 1.25rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.75;
      font-size: 0.875rem;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: transparent;
      caret-color: #7c3aed;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow-y: auto;
    }

    .editor-textarea::placeholder { color: #94a3b8; }
    .editor-textarea::selection { background: rgba(124, 58, 237, 0.15); }

    /* ── Highlight spans ────────────────────────────────────────────── */
    .highlight-error {
      background-color: #fff1f2;
      border-bottom: 2px solid #f43f5e;
      border-radius: 2px 2px 0 0;
      transition: background-color 0.15s;
      cursor: default;
    }
    .highlight-error.is-active { background-color: #ffe4e6; }

    .highlight-warning {
      background-color: #fffbeb;
      border-bottom: 2px solid #f59e0b;
      border-radius: 2px 2px 0 0;
      transition: background-color 0.15s;
      cursor: default;
    }
    .highlight-warning.is-active { background-color: #fef3c7; }

    .highlight-info {
      background-color: #f5f3ff;
      border-bottom: 2px solid #8b5cf6;
      border-radius: 2px 2px 0 0;
      transition: background-color 0.15s;
      cursor: default;
    }
    .highlight-info.is-active { background-color: #ede9fe; }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: 360px;
      flex-shrink: 0;
      background: #fff;
      border-left: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 0.625rem;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: inherit;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover { color: #64748b; }
    .tab-btn.active { color: #7c3aed; border-bottom-color: #7c3aed; }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }

    .tab-content.hidden { display: none; }

    /* Scrollbar */
    .tab-content::-webkit-scrollbar { width: 6px; }
    .tab-content::-webkit-scrollbar-track { background: transparent; }
    .tab-content::-webkit-scrollbar-thumb { background: #ddd6fe; border-radius: 3px; }
    .tab-content::-webkit-scrollbar-thumb:hover { background: #a78bfa; }

    /* ── Finding cards ──────────────────────────────────────────────── */
    .finding-card {
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      animation: slideIn 0.15s ease-out forwards;
    }

    .finding-card:hover { border-color: #c4b5fd; }
    .finding-card.is-active {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .finding-header {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      margin-bottom: 0.375rem;
    }

    .severity-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .severity-badge.error   { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    .severity-badge.warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .severity-badge.info    { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }

    .finding-rule-id {
      font-size: 0.6875rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .finding-message {
      font-size: 0.8125rem;
      color: #334155;
      line-height: 1.5;
    }

    .finding-suggestion {
      margin-top: 0.5rem;
      padding: 0.5rem 0.625rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      color: #475569;
      line-height: 1.5;
    }

    .finding-suggestion-label {
      font-weight: 600;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #7c3aed;
      margin-bottom: 0.25rem;
    }

    /* ── Empty state ────────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
      color: #94a3b8;
    }

    .empty-state svg { width: 40px; height: 40px; margin-bottom: 0.75rem; opacity: 0.5; }
    .empty-state p { font-size: 0.8125rem; }

    /* ── Rule groups panel ──────────────────────────────────────────── */
    .group-item {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.625rem 0.5rem;
      border-radius: 0.375rem;
      transition: background 0.1s;
    }

    .group-item:hover { background: #f8fafc; }

    .group-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #7c3aed;
      cursor: pointer;
      flex-shrink: 0;
    }

    .group-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: #334155;
      flex: 1;
    }

    .group-count {
      font-size: 0.6875rem;
      color: #94a3b8;
      font-weight: 500;
    }

    /* ── Tooltip ─────────────────────────────────────────────────────── */
    .tooltip {
      position: fixed;
      z-index: 9999;
      max-width: 320px;
      padding: 0.625rem 0.75rem;
      background: #1e293b;
      color: #f1f5f9;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      line-height: 1.5;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      pointer-events: none;
      animation: tooltipIn 0.12s ease-out;
    }

    .tooltip .tip-rule { color: #94a3b8; font-size: 0.6875rem; margin-bottom: 0.25rem; }
    .tooltip .tip-message { color: #f1f5f9; }
    .tooltip .tip-suggestion { color: #a5b4fc; margin-top: 0.375rem; font-style: italic; }

    @keyframes tooltipIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Filter bar ──────────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 0.375rem;
      padding-bottom: 0.625rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #f1f5f9;
      flex-shrink: 0;
    }

    .filter-btn {
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.6875rem;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #64748b;
      cursor: pointer;
      transition: all 0.1s;
    }

    .filter-btn:hover { background: #f8fafc; }
    .filter-btn.active { background: #f5f3ff; color: #7c3aed; border-color: #c4b5fd; }

    /* ── Connection banner ───────────────────────────────────────────── */
    .banner {
      padding: 0.5rem 1.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-align: center;
      flex-shrink: 0;
    }

    .banner.error { background: #fff1f2; color: #e11d48; }
    .banner.waking { background: #fffbeb; color: #d97706; }
    .banner.hidden { display: none; }
  </style>
</head>
<body>

  <!-- Banner for connection errors -->
  <div id="banner" class="banner hidden"></div>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      Octavius
    </div>
    <div class="stats" id="stats"></div>
    <div class="status" id="status"></div>
  </header>

  <!-- Main -->
  <main class="main">
    <!-- Editor -->
    <section class="editor-pane">
      <div class="editor-container">
        <div class="editor-backdrop" id="backdrop"></div>
        <textarea class="editor-textarea" id="editor"
          placeholder="Start typing or paste your document here..."
          spellcheck="false"></textarea>
      </div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="issues">Issues</button>
        <button class="tab-btn" data-tab="rules">Rules</button>
      </div>
      <div class="tab-content" id="issues-panel">
        <div class="filter-bar" id="filter-bar"></div>
        <div id="findings-list"></div>
      </div>
      <div class="tab-content hidden" id="rules-panel"></div>
    </aside>
  </main>

  <!-- Tooltip (hidden, positioned via JS) -->
  <div class="tooltip" id="tooltip" style="display:none"></div>

  <script>
    // ── Configuration ──────────────────────────────────────────────────
    const API_BASE = 'http://localhost:8000';
    const DEBOUNCE_MS = 300;

    // ── State ──────────────────────────────────────────────────────────
    const state = {
      findings: [],
      groups: [],
      activeGroups: new Set(),
      activeFilter: 'all',
      activeFindingIdx: -1,
      abortController: null,
      debounceTimer: null,
      checking: false,
      wakingUp: false,
    };

    // ── DOM refs ───────────────────────────────────────────────────────
    const $editor   = document.getElementById('editor');
    const $backdrop = document.getElementById('backdrop');
    const $stats    = document.getElementById('stats');
    const $status   = document.getElementById('status');
    const $findings = document.getElementById('findings-list');
    const $filters  = document.getElementById('filter-bar');
    const $issues   = document.getElementById('issues-panel');
    const $rules    = document.getElementById('rules-panel');
    const $tooltip  = document.getElementById('tooltip');
    const $banner   = document.getElementById('banner');
    const $tabs     = document.querySelectorAll('.tab-btn');

    // ── Severity helpers ───────────────────────────────────────────────
    const SEV_ORDER = { error: 0, warning: 1, info: 2 };
    const SEV_LABEL = { error: 'Error', warning: 'Warning', info: 'Info' };

    // ── Initialization ─────────────────────────────────────────────────
    async function init() {
      loadGroups();
      setupListeners();
    }

    async function loadGroups() {
      try {
        const res = await fetch(API_BASE + '/groups');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        state.groups = await res.json();
        hideBanner();

        const saved = localStorage.getItem('octavius-groups');
        if (saved) {
          const parsed = JSON.parse(saved);
          state.activeGroups = new Set(parsed.filter(g =>
            state.groups.some(sg => sg.id === g)
          ));
        }
        if (state.activeGroups.size === 0) {
          state.activeGroups = new Set(state.groups.map(g => g.id));
        }

        renderRulesPanel();
      } catch (err) {
        showBanner('Could not connect to backend. Is the server running?', 'error');
        state.groups = [];
      }
    }

    function setupListeners() {
      $editor.addEventListener('input', onInput);
      $editor.addEventListener('scroll', syncScroll);
      $editor.addEventListener('click', onEditorClick);
      $editor.addEventListener('mousemove', onEditorMouseMove);
      $editor.addEventListener('mouseleave', () => hideTooltip());

      $tabs.forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
    }

    // ── Tab switching ──────────────────────────────────────────────────
    function switchTab(tab) {
      $tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      $issues.classList.toggle('hidden', tab !== 'issues');
      $rules.classList.toggle('hidden', tab !== 'rules');
    }

    // ── Debounced input ────────────────────────────────────────────────
    function onInput() {
      clearTimeout(state.debounceTimer);
      state.debounceTimer = setTimeout(() => runCheck(), DEBOUNCE_MS);
    }

    // ── Core check call ────────────────────────────────────────────────
    async function runCheck() {
      const text = $editor.value;
      if (!text.trim()) {
        state.findings = [];
        renderHighlights();
        renderFindings();
        renderStats();
        return;
      }

      if (state.abortController) {
        state.abortController.abort();
      }
      state.abortController = new AbortController();

      setChecking(true);
      const wakingTimer = setTimeout(() => {
        showBanner('Server is waking up — this may take up to 30 seconds...', 'waking');
        state.wakingUp = true;
      }, 3000);

      try {
        const res = await fetch(API_BASE + '/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            rule_groups: [...state.activeGroups],
          }),
          signal: state.abortController.signal,
        });

        clearTimeout(wakingTimer);
        if (state.wakingUp) { hideBanner(); state.wakingUp = false; }

        if (!res.ok) throw new Error('HTTP ' + res.status);

        state.findings = await res.json();
        state.activeFindingIdx = -1;
        hideBanner();
        renderHighlights();
        renderFindings();
        renderStats();
      } catch (err) {
        clearTimeout(wakingTimer);
        if (err.name === 'AbortError') return;
        showBanner('Check failed: ' + err.message, 'error');
      } finally {
        setChecking(false);
      }
    }

    // ── Highlight rendering (overlay div) ──────────────────────────────
    function buildSegments(text, findings) {
      if (!text) return [];
      if (!findings.length) return [{ text: text, finding: null }];

      const sorted = [...findings].sort((a, b) => a.start - b.start);
      const segments = [];
      let cursor = 0;

      for (const f of sorted) {
        const start = Math.max(0, Math.min(f.start, text.length));
        const end = Math.max(start, Math.min(f.end, text.length));

        if (start < cursor) continue;

        if (start > cursor) {
          segments.push({ text: text.slice(cursor, start), finding: null });
        }
        segments.push({ text: text.slice(start, end), finding: f });
        cursor = end;
      }

      if (cursor < text.length) {
        segments.push({ text: text.slice(cursor), finding: null });
      }
      return segments;
    }

    function renderHighlights() {
      const text = $editor.value;
      const segments = buildSegments(text, state.findings);

      $backdrop.innerHTML = '';
      segments.forEach((seg, i) => {
        const span = document.createElement('span');
        span.textContent = seg.text;
        if (seg.finding) {
          span.className = 'highlight-' + seg.finding.severity;
          span.dataset.idx = String(state.findings.indexOf(seg.finding));
        }
        $backdrop.appendChild(span);
      });
    }

    // ── Scroll sync ────────────────────────────────────────────────────
    function syncScroll() {
      $backdrop.scrollTop = $editor.scrollTop;
      $backdrop.scrollLeft = $editor.scrollLeft;
    }

    // ── Stats bar ──────────────────────────────────────────────────────
    function renderStats() {
      const counts = { error: 0, warning: 0, info: 0 };
      state.findings.forEach(f => { counts[f.severity] = (counts[f.severity] || 0) + 1; });

      $stats.innerHTML = ['error', 'warning', 'info'].map(sev =>
        '<span class="stat-chip ' + sev + '">' +
        counts[sev] + ' ' + SEV_LABEL[sev] +
        (counts[sev] !== 1 ? 's' : '') +
        '</span>'
      ).join('');
    }

    // ── Findings list ──────────────────────────────────────────────────
    function renderFindings() {
      renderFilterBar();

      const filtered = state.activeFilter === 'all'
        ? state.findings
        : state.findings.filter(f => f.severity === state.activeFilter);

      if (!filtered.length) {
        $findings.innerHTML =
          '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>' +
          '<p>' + (state.findings.length ? 'No issues for this filter' : 'No issues found — start typing above') + '</p>' +
          '</div>';
        return;
      }

      $findings.innerHTML = filtered.map((f, i) => {
        const realIdx = state.findings.indexOf(f);
        const active = realIdx === state.activeFindingIdx ? ' is-active' : '';
        return (
          '<div class="finding-card' + active + '" data-idx="' + realIdx + '" style="animation-delay:' + (i * 30) + 'ms" onclick="selectFinding(' + realIdx + ')">' +
            '<div class="finding-header">' +
              '<span class="severity-badge ' + f.severity + '">' + SEV_LABEL[f.severity] + '</span>' +
              '<span class="finding-rule-id">' + escHtml(f.rule_id) + '</span>' +
            '</div>' +
            '<div class="finding-message">' + escHtml(f.message) + '</div>' +
            (f.suggestion
              ? '<div class="finding-suggestion"><div class="finding-suggestion-label">Suggestion</div>' + escHtml(f.suggestion) + '</div>'
              : '') +
          '</div>'
        );
      }).join('');
    }

    function renderFilterBar() {
      const counts = { error: 0, warning: 0, info: 0 };
      state.findings.forEach(f => { counts[f.severity] = (counts[f.severity] || 0) + 1; });

      const filters = [
        { key: 'all', label: 'All (' + state.findings.length + ')' },
        { key: 'error', label: 'Errors (' + counts.error + ')' },
        { key: 'warning', label: 'Warnings (' + counts.warning + ')' },
        { key: 'info', label: 'Info (' + counts.info + ')' },
      ];

      $filters.innerHTML = filters.map(f =>
        '<button class="filter-btn' + (state.activeFilter === f.key ? ' active' : '') +
        '" onclick="setFilter(\'' + f.key + '\')">' + f.label + '</button>'
      ).join('');
    }

    function setFilter(key) {
      state.activeFilter = key;
      renderFindings();
    }

    // ── Select finding (click sidebar card or editor) ──────────────────
    function selectFinding(idx) {
      state.activeFindingIdx = idx;
      const f = state.findings[idx];
      if (!f) return;

      renderFindings();
      renderHighlights();

      // Activate the corresponding highlight span
      const hlSpan = $backdrop.querySelector('[data-idx="' + idx + '"]');
      if (hlSpan) hlSpan.classList.add('is-active');

      // Scroll textarea to the finding
      $editor.focus();
      $editor.setSelectionRange(f.start, f.end);

      // Scroll card into view
      const card = $findings.querySelector('.finding-card.is-active');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── Editor click → find which finding was clicked ──────────────────
    function onEditorClick() {
      const pos = $editor.selectionStart;
      const idx = state.findings.findIndex(f => pos >= f.start && pos < f.end);
      if (idx >= 0) {
        selectFinding(idx);
      } else {
        state.activeFindingIdx = -1;
        renderHighlights();
        renderFindings();
      }
    }

    // ── Tooltip on mouse move ──────────────────────────────────────────
    function onEditorMouseMove(e) {
      let pos;
      if (document.caretPositionFromPoint) {
        const cp = document.caretPositionFromPoint(e.clientX, e.clientY);
        pos = cp ? cp.offset : null;
      } else if (document.caretRangeFromPoint) {
        const range = document.caretRangeFromPoint(e.clientX, e.clientY);
        pos = range ? range.startOffset : null;
      }

      if (pos == null) { hideTooltip(); return; }

      // caretRangeFromPoint gives offset within a text node, need absolute offset
      // For a textarea we use selectionStart based on a temporary trick
      // Instead, compute approximate position from the textarea value
      // Actually, for textareas, caretPositionFromPoint/caretRangeFromPoint
      // returns the offset within the textarea's text content directly
      const finding = state.findings.find(f => pos >= f.start && pos < f.end);

      if (finding) {
        showTooltip(finding, e.clientX, e.clientY);
      } else {
        hideTooltip();
      }
    }

    function showTooltip(finding, x, y) {
      $tooltip.innerHTML =
        '<div class="tip-rule">' + escHtml(finding.rule_id) + ' &middot; ' + SEV_LABEL[finding.severity] + '</div>' +
        '<div class="tip-message">' + escHtml(finding.message) + '</div>' +
        (finding.suggestion ? '<div class="tip-suggestion">' + escHtml(finding.suggestion) + '</div>' : '');

      $tooltip.style.display = 'block';

      // Position avoiding viewport overflow
      const rect = $tooltip.getBoundingClientRect();
      const left = Math.min(x + 12, window.innerWidth - rect.width - 12);
      const top = y + 20 + rect.height > window.innerHeight
        ? y - rect.height - 8
        : y + 20;

      $tooltip.style.left = left + 'px';
      $tooltip.style.top = top + 'px';
    }

    function hideTooltip() {
      $tooltip.style.display = 'none';
    }

    // ── Rule groups panel ──────────────────────────────────────────────
    function renderRulesPanel() {
      if (!state.groups.length) {
        $rules.innerHTML =
          '<div class="empty-state"><p>No rule groups available</p></div>';
        return;
      }

      $rules.innerHTML = state.groups.map(g => {
        const checked = state.activeGroups.has(g.id) ? ' checked' : '';
        return (
          '<label class="group-item">' +
            '<input type="checkbox"' + checked + ' data-group="' + escHtml(g.id) + '" onchange="toggleGroup(\'' + escHtml(g.id) + '\', this.checked)">' +
            '<span class="group-label">' + escHtml(g.name) + '</span>' +
            '<span class="group-count">' + g.rule_count + ' rule' + (g.rule_count !== 1 ? 's' : '') + '</span>' +
          '</label>'
        );
      }).join('');
    }

    function toggleGroup(id, enabled) {
      if (enabled) {
        state.activeGroups.add(id);
      } else {
        state.activeGroups.delete(id);
      }
      localStorage.setItem('octavius-groups', JSON.stringify([...state.activeGroups]));
      runCheck();
    }

    // ── Loading / status ───────────────────────────────────────────────
    function setChecking(on) {
      state.checking = on;
      $status.innerHTML = on
        ? '<div class="spinner"></div> Checking...'
        : '';
    }

    // ── Banner ─────────────────────────────────────────────────────────
    function showBanner(msg, type) {
      $banner.textContent = msg;
      $banner.className = 'banner ' + type;
    }

    function hideBanner() {
      $banner.className = 'banner hidden';
    }

    // ── Utilities ──────────────────────────────────────────────────────
    function escHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Start ──────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
