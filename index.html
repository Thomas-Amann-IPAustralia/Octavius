<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octavius — Plain Language Linter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.125rem;
      color: #7c3aed;
    }

    .logo svg { width: 24px; height: 24px; }

    .stats {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .stat-chip.error   { background: #fff1f2; color: #e11d48; }
    .stat-chip.warning { background: #fffbeb; color: #d97706; }
    .stat-chip.info    { background: #f5f3ff; color: #7c3aed; }

    .status {
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #e2e8f0;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main layout ────────────────────────────────────────────────── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Editor pane ────────────────────────────────────────────────── */
    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .editor-container {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #fff;
    }

    .editor-backdrop {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 1rem 1.25rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.75;
      font-size: 0.875rem;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #1e293b;
      overflow-y: auto;
      pointer-events: none;
    }

    .editor-textarea {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 1rem 1.25rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.75;
      font-size: 0.875rem;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: transparent;
      caret-color: #7c3aed;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow-y: auto;
    }

    .editor-textarea::placeholder { color: #94a3b8; }
    .editor-textarea::selection { background: rgba(124, 58, 237, 0.15); }

    /* ── Highlight spans ────────────────────────────────────────────── */
    .highlight-error {
      background-color: #fff1f2;
      border-bottom: 2px solid #f43f5e;
      border-radius: 2px 2px 0 0;
      transition: background-color 0.15s;
      cursor: default;
    }
    .highlight-error.is-active { background-color: #ffe4e6; }

    .highlight-warning {
      background-color: #fffbeb;
      border-bottom: 2px solid #f59e0b;
      border-radius: 2px 2px 0 0;
      transition: background-color 0.15s;
      cursor: default;
    }
    .highlight-warning.is-active { background-color: #fef3c7; }

    .highlight-info {
      background-color: #f5f3ff;
      border-bottom: 2px solid #8b5cf6;
      border-radius: 2px 2px 0 0;
      transition: background-color 0.15s;
      cursor: default;
    }
    .highlight-info.is-active { background-color: #ede9fe; }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: 360px;
      flex-shrink: 0;
      background: #fff;
      border-left: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 0.625rem;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: inherit;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover { color: #64748b; }
    .tab-btn.active { color: #7c3aed; border-bottom-color: #7c3aed; }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }

    .tab-content.hidden { display: none; }

    /* Scrollbar */
    .tab-content::-webkit-scrollbar { width: 6px; }
    .tab-content::-webkit-scrollbar-track { background: transparent; }
    .tab-content::-webkit-scrollbar-thumb { background: #ddd6fe; border-radius: 3px; }
    .tab-content::-webkit-scrollbar-thumb:hover { background: #a78bfa; }

    /* ── Finding cards ──────────────────────────────────────────────── */
    .finding-card {
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      animation: slideIn 0.15s ease-out forwards;
    }

    .finding-card:hover { border-color: #c4b5fd; }
    .finding-card.is-active {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .finding-header {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      margin-bottom: 0.375rem;
      flex-wrap: wrap;
    }

    .severity-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .severity-badge.error   { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    .severity-badge.warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .severity-badge.info    { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }

    .finding-rule-id {
      font-size: 0.6875rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .finding-message {
      font-size: 0.8125rem;
      color: #334155;
      line-height: 1.5;
    }

    .finding-summary {
      margin-top: 0.25rem;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.5;
    }

    .finding-source-link {
      display: inline-block;
      margin-top: 0.375rem;
      font-size: 0.6875rem;
      color: #7c3aed;
      text-decoration: none;
      font-weight: 500;
    }
    .finding-source-link:hover { text-decoration: underline; }

    /* ── Document-level pill ────────────────────────────────────────── */
    .doc-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f0f9ff;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    /* ── Empty state ────────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
      color: #94a3b8;
    }

    .empty-state svg { width: 40px; height: 40px; margin-bottom: 0.75rem; opacity: 0.5; }
    .empty-state p { font-size: 0.8125rem; }

    /* ── Rules search ───────────────────────────────────────────────── */
    .rules-search {
      width: 100%;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.375rem;
      font-family: inherit;
      font-size: 0.8125rem;
      color: #334155;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .rules-search:focus {
      border-color: #c4b5fd;
      background: #fff;
    }
    .rules-search::placeholder { color: #94a3b8; }

    /* ── Taxonomy sections ──────────────────────────────────────────── */
    .taxonomy-section { margin-bottom: 0.125rem; }

    .taxonomy-header {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.25rem;
      border-radius: 0.375rem;
    }
    .taxonomy-header:hover { background: #f8fafc; }

    .expand-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, color 0.15s;
      flex-shrink: 0;
      border-radius: 3px;
    }
    .expand-btn:hover { color: #7c3aed; }
    .expand-btn svg { width: 12px; height: 12px; }
    .expand-btn.expanded { transform: rotate(90deg); }

    .taxonomy-label {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      flex: 1;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }
    .taxonomy-label input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: #7c3aed;
      cursor: pointer;
      flex-shrink: 0;
    }

    .taxonomy-count {
      font-size: 0.6875rem;
      color: #94a3b8;
      font-weight: 500;
      padding: 0.125rem 0.375rem;
      background: #f1f5f9;
      border-radius: 9999px;
    }

    .taxonomy-rules {
      padding: 0.125rem 0 0.25rem 1.375rem;
    }

    /* ── Rule item ──────────────────────────────────────────────────── */
    .rule-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.3125rem 0.25rem;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: background 0.1s;
    }
    .rule-item:hover { background: #f8fafc; }

    .rule-item input[type="checkbox"] {
      width: 13px;
      height: 13px;
      accent-color: #7c3aed;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .rule-item.tax-disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .rule-flag {
      font-size: 0.75rem;
      color: #475569;
      line-height: 1.4;
    }

    .no-matches {
      font-size: 0.75rem;
      color: #94a3b8;
      padding: 0.375rem 0.25rem;
      font-style: italic;
    }

    /* ── Filter bar ──────────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 0.375rem;
      padding-bottom: 0.625rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #f1f5f9;
      flex-shrink: 0;
    }

    .filter-btn {
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.6875rem;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #64748b;
      cursor: pointer;
      transition: all 0.1s;
    }

    .filter-btn:hover { background: #f8fafc; }
    .filter-btn.active { background: #f5f3ff; color: #7c3aed; border-color: #c4b5fd; }

    /* ── Tooltip ─────────────────────────────────────────────────────── */
    .tooltip {
      position: fixed;
      z-index: 9999;
      max-width: 320px;
      padding: 0.625rem 0.75rem;
      background: #1e293b;
      color: #f1f5f9;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      line-height: 1.5;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      pointer-events: none;
      animation: tooltipIn 0.12s ease-out;
    }

    .tooltip .tip-rule { color: #94a3b8; font-size: 0.6875rem; margin-bottom: 0.25rem; }
    .tooltip .tip-message { color: #f1f5f9; }
    .tooltip .tip-suggestion { color: #a5b4fc; margin-top: 0.375rem; font-style: italic; }

    @keyframes tooltipIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Connection banner ───────────────────────────────────────────── */
    .banner {
      padding: 0.5rem 1.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-align: center;
      flex-shrink: 0;
    }

    .banner.error { background: #fff1f2; color: #e11d48; }
    .banner.waking { background: #fffbeb; color: #d97706; }
    .banner.hidden { display: none; }
  </style>
</head>
<body>

  <!-- Banner for connection errors -->
  <div id="banner" class="banner hidden"></div>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      Octavius
    </div>
    <div class="stats" id="stats"></div>
    <div class="status" id="status"></div>
  </header>

  <!-- Main -->
  <main class="main">
    <!-- Editor -->
    <section class="editor-pane">
      <div class="editor-container">
        <div class="editor-backdrop" id="backdrop"></div>
        <textarea class="editor-textarea" id="editor"
          placeholder="Start typing or paste your document here..."
          spellcheck="false"></textarea>
      </div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="issues">Issues</button>
        <button class="tab-btn" data-tab="rules">Rules</button>
      </div>
      <div class="tab-content" id="issues-panel">
        <div class="filter-bar" id="filter-bar"></div>
        <div id="findings-list"></div>
      </div>
      <div class="tab-content hidden" id="rules-panel"></div>
    </aside>
  </main>

  <!-- Tooltip (hidden, positioned via JS) -->
  <div class="tooltip" id="tooltip" style="display:none"></div>

  <script>
    // ── Configuration ──────────────────────────────────────────────────
    const API_BASE = window.OCTAVIUS_API_BASE || '';
    const DEBOUNCE_MS = 300;

    // ── State ──────────────────────────────────────────────────────────
    const state = {
      findings: [],
      rules: [],
      taxonomies: [],
      disabledRuleIds: new Set(),
      disabledTaxonomies: new Set(),
      ruleSearch: '',
      expandedTaxonomies: new Set(),
      activeFilter: 'all',
      activeFindingIdx: -1,
      abortController: null,
      debounceTimer: null,
      checking: false,
      wakingUp: false,
    };

    // ── DOM refs ───────────────────────────────────────────────────────
    const $editor   = document.getElementById('editor');
    const $backdrop = document.getElementById('backdrop');
    const $stats    = document.getElementById('stats');
    const $status   = document.getElementById('status');
    const $findings = document.getElementById('findings-list');
    const $filters  = document.getElementById('filter-bar');
    const $issues   = document.getElementById('issues-panel');
    const $rules    = document.getElementById('rules-panel');
    const $tooltip  = document.getElementById('tooltip');
    const $banner   = document.getElementById('banner');
    const $tabs     = document.querySelectorAll('.tab-btn');

    // ── Severity helpers ───────────────────────────────────────────────
    const SEV_ORDER = { error: 0, warning: 1, info: 2 };
    const SEV_LABEL = { error: 'Error', warning: 'Warning', info: 'Info' };

    // ── Initialization ─────────────────────────────────────────────────
    function init() {
      loadRulesCatalogue();
      setupListeners();
    }

    // ── Load rules catalogue ───────────────────────────────────────────
    async function loadRulesCatalogue() {
      try {
        const [rulesRes, taxRes] = await Promise.all([
          fetch(API_BASE + '/rules'),
          fetch(API_BASE + '/taxonomies'),
        ]);
        if (!rulesRes.ok) throw new Error('HTTP ' + rulesRes.status);
        if (!taxRes.ok) throw new Error('HTTP ' + taxRes.status);

        state.rules = await rulesRes.json();
        state.taxonomies = await taxRes.json();
        hideBanner();
        loadState();
        renderRulesPanel();

        if ($editor.value.trim()) runCheck();
      } catch (err) {
        showBanner('Could not connect to backend. Is the server running?', 'error');
        state.rules = [];
        state.taxonomies = [];
        $rules.innerHTML = '<div class="empty-state"><p>No rule groups available</p></div>';
      }
    }

    // ── Persist / load disabled state ──────────────────────────────────
    function saveState() {
      localStorage.setItem('octavius.disabledRuleIds',
        JSON.stringify([...state.disabledRuleIds]));
      localStorage.setItem('octavius.disabledTaxonomies',
        JSON.stringify([...state.disabledTaxonomies]));
    }

    function loadState() {
      // Migrate legacy octavius-groups key (stored enabled group ids)
      const legacy = localStorage.getItem('octavius-groups');
      if (legacy) {
        try {
          const enabledGroups = JSON.parse(legacy);
          const allTax = ['lookup', 'regex', 'structural'];
          allTax.filter(t => !enabledGroups.includes(t))
               .forEach(t => state.disabledTaxonomies.add(t));
        } catch (e) {}
        localStorage.removeItem('octavius-groups');
        saveState();
        return;
      }

      try {
        const ids = localStorage.getItem('octavius.disabledRuleIds');
        if (ids) state.disabledRuleIds = new Set(JSON.parse(ids));
      } catch (e) {}

      try {
        const taxes = localStorage.getItem('octavius.disabledTaxonomies');
        if (taxes) state.disabledTaxonomies = new Set(JSON.parse(taxes));
      } catch (e) {}
    }

    // ── Event listeners ────────────────────────────────────────────────
    function setupListeners() {
      $editor.addEventListener('input', onInput);
      $editor.addEventListener('scroll', syncScroll);
      $editor.addEventListener('click', onEditorClick);
      $editor.addEventListener('mousemove', onEditorMouseMove);
      $editor.addEventListener('mouseleave', () => hideTooltip());

      $tabs.forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
    }

    // ── Tab switching ──────────────────────────────────────────────────
    function switchTab(tab) {
      $tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      $issues.classList.toggle('hidden', tab !== 'issues');
      $rules.classList.toggle('hidden', tab !== 'rules');
    }

    // ── Debounced input ────────────────────────────────────────────────
    function onInput() {
      clearTimeout(state.debounceTimer);
      state.debounceTimer = setTimeout(() => runCheck(), DEBOUNCE_MS);
    }

    // ── Core check call ────────────────────────────────────────────────
    async function runCheck() {
      const text = $editor.value;
      if (!text.trim()) {
        state.findings = [];
        renderHighlights();
        renderFindings();
        renderStats();
        return;
      }

      if (state.abortController) {
        state.abortController.abort();
      }
      state.abortController = new AbortController();

      setChecking(true);
      const wakingTimer = setTimeout(() => {
        showBanner('Server is waking up — this may take up to 30 seconds...', 'waking');
        state.wakingUp = true;
      }, 3000);

      try {
        const res = await fetch(API_BASE + '/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            disabled_rule_ids: [...state.disabledRuleIds],
            disabled_taxonomies: [...state.disabledTaxonomies],
          }),
          signal: state.abortController.signal,
        });

        clearTimeout(wakingTimer);
        if (state.wakingUp) { hideBanner(); state.wakingUp = false; }

        if (!res.ok) throw new Error('HTTP ' + res.status);

        state.findings = await res.json();
        state.activeFindingIdx = -1;
        hideBanner();
        renderHighlights();
        renderFindings();
        renderStats();
      } catch (err) {
        clearTimeout(wakingTimer);
        if (err.name === 'AbortError') return;
        showBanner('Check failed: ' + err.message, 'error');
      } finally {
        setChecking(false);
      }
    }

    // ── Highlight rendering (overlay div) ──────────────────────────────
    function buildSegments(text, findings) {
      if (!text) return [];
      if (!findings.length) return [{ text: text, finding: null }];

      const sorted = [...findings].sort((a, b) => a.start - b.start);
      const segments = [];
      let cursor = 0;

      for (const f of sorted) {
        const start = Math.max(0, Math.min(f.start, text.length));
        const end = Math.max(start, Math.min(f.end, text.length));

        if (start < cursor) continue;

        if (start > cursor) {
          segments.push({ text: text.slice(cursor, start), finding: null });
        }
        segments.push({ text: text.slice(start, end), finding: f });
        cursor = end;
      }

      if (cursor < text.length) {
        segments.push({ text: text.slice(cursor), finding: null });
      }
      return segments;
    }

    function renderHighlights() {
      const text = $editor.value;
      // Document-level findings have start=end=0 and no inline span
      const inlineFindings = state.findings.filter(f => !f.document_level);
      const segments = buildSegments(text, inlineFindings);

      $backdrop.innerHTML = '';
      segments.forEach(seg => {
        const span = document.createElement('span');
        span.textContent = seg.text;
        if (seg.finding) {
          span.className = 'highlight-' + seg.finding.severity;
          span.dataset.idx = String(state.findings.indexOf(seg.finding));
        }
        $backdrop.appendChild(span);
      });
    }

    // ── Scroll sync ────────────────────────────────────────────────────
    function syncScroll() {
      $backdrop.scrollTop = $editor.scrollTop;
      $backdrop.scrollLeft = $editor.scrollLeft;
    }

    // ── Stats bar ──────────────────────────────────────────────────────
    function renderStats() {
      const counts = { error: 0, warning: 0, info: 0 };
      state.findings.forEach(f => { counts[f.severity] = (counts[f.severity] || 0) + 1; });

      $stats.innerHTML = ['error', 'warning', 'info'].map(sev =>
        '<span class="stat-chip ' + sev + '">' +
        counts[sev] + ' ' + SEV_LABEL[sev] +
        (counts[sev] !== 1 ? 's' : '') +
        '</span>'
      ).join('');
    }

    // ── Findings list ──────────────────────────────────────────────────
    function renderFindings() {
      renderFilterBar();

      const filtered = state.activeFilter === 'all'
        ? state.findings
        : state.findings.filter(f => f.severity === state.activeFilter);

      if (!filtered.length) {
        $findings.innerHTML =
          '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>' +
          '<p>' + (state.findings.length ? 'No issues for this filter' : 'No issues found — start typing above') + '</p>' +
          '</div>';
        return;
      }

      $findings.innerHTML = filtered.map((f, i) => {
        const realIdx = state.findings.indexOf(f);
        const active = realIdx === state.activeFindingIdx ? ' is-active' : '';
        const isDoc = f.document_level === true;
        return (
          '<div class="finding-card' + active + '" data-idx="' + realIdx + '" style="animation-delay:' + (i * 30) + 'ms" onclick="selectFinding(' + realIdx + ')">' +
            '<div class="finding-header">' +
              '<span class="severity-badge ' + f.severity + '">' + SEV_LABEL[f.severity] + '</span>' +
              (isDoc ? '<span class="doc-pill">Document</span>' : '') +
              '<span class="finding-rule-id">' + escHtml(f.rule_id) + '</span>' +
            '</div>' +
            '<div class="finding-message">' + escHtml(f.ui_flag || f.message) + '</div>' +
            (f.rule_summary ? '<div class="finding-summary">' + escHtml(f.rule_summary) + '</div>' : '') +
            (f.source_url
              ? '<a href="' + escHtml(f.source_url) + '" target="_blank" rel="noopener" class="finding-source-link" onclick="event.stopPropagation()">View source ↗</a>'
              : '') +
          '</div>'
        );
      }).join('');
    }

    function renderFilterBar() {
      const counts = { error: 0, warning: 0, info: 0 };
      state.findings.forEach(f => { counts[f.severity] = (counts[f.severity] || 0) + 1; });

      const filters = [
        { key: 'all', label: 'All (' + state.findings.length + ')' },
        { key: 'error', label: 'Errors (' + counts.error + ')' },
        { key: 'warning', label: 'Warnings (' + counts.warning + ')' },
        { key: 'info', label: 'Info (' + counts.info + ')' },
      ];

      $filters.innerHTML = filters.map(f =>
        '<button class="filter-btn' + (state.activeFilter === f.key ? ' active' : '') +
        '" onclick="setFilter(\'' + f.key + '\')">' + f.label + '</button>'
      ).join('');
    }

    function setFilter(key) {
      state.activeFilter = key;
      renderFindings();
    }

    // ── Select finding (click sidebar card or editor) ──────────────────
    function selectFinding(idx) {
      state.activeFindingIdx = idx;
      const f = state.findings[idx];
      if (!f) return;

      renderFindings();
      renderHighlights();

      // Activate the corresponding highlight span (only exists for inline findings)
      const hlSpan = $backdrop.querySelector('[data-idx="' + idx + '"]');
      if (hlSpan) hlSpan.classList.add('is-active');

      // Document-level findings have no text location — skip scroll
      if (!f.document_level) {
        $editor.focus();
        $editor.setSelectionRange(f.start, f.end);
      }

      // Scroll card into view
      const card = $findings.querySelector('.finding-card.is-active');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── Editor click → find which finding was clicked ──────────────────
    function onEditorClick() {
      const pos = $editor.selectionStart;
      // Document-level findings have start=end=0; pos<0 guard prevents false matches
      const idx = state.findings.findIndex(f => !f.document_level && pos >= f.start && pos < f.end);
      if (idx >= 0) {
        selectFinding(idx);
      } else {
        state.activeFindingIdx = -1;
        renderHighlights();
        renderFindings();
      }
    }

    // ── Tooltip on mouse move ──────────────────────────────────────────
    function onEditorMouseMove(e) {
      let pos;
      if (document.caretPositionFromPoint) {
        const cp = document.caretPositionFromPoint(e.clientX, e.clientY);
        pos = cp ? cp.offset : null;
      } else if (document.caretRangeFromPoint) {
        const range = document.caretRangeFromPoint(e.clientX, e.clientY);
        pos = range ? range.startOffset : null;
      }

      if (pos == null) { hideTooltip(); return; }

      const finding = state.findings.find(
        f => !f.document_level && pos >= f.start && pos < f.end
      );

      if (finding) {
        showTooltip(finding, e.clientX, e.clientY);
      } else {
        hideTooltip();
      }
    }

    function showTooltip(finding, x, y) {
      $tooltip.innerHTML =
        '<div class="tip-rule">' + escHtml(finding.rule_id) + ' &middot; ' + SEV_LABEL[finding.severity] + '</div>' +
        '<div class="tip-message">' + escHtml(finding.ui_flag || finding.message) + '</div>' +
        (finding.rule_summary ? '<div class="tip-suggestion">' + escHtml(finding.rule_summary) + '</div>' : '');

      $tooltip.style.display = 'block';

      // Position avoiding viewport overflow
      const rect = $tooltip.getBoundingClientRect();
      const left = Math.min(x + 12, window.innerWidth - rect.width - 12);
      const top = y + 20 + rect.height > window.innerHeight
        ? y - rect.height - 8
        : y + 20;

      $tooltip.style.left = left + 'px';
      $tooltip.style.top = top + 'px';
    }

    function hideTooltip() {
      $tooltip.style.display = 'none';
    }

    // ── Rules panel ────────────────────────────────────────────────────
    // Creates the search input once; re-renders only the taxonomy sections
    // on each update so the search box keeps its value and focus.
    function renderRulesPanel() {
      if (!document.getElementById('rules-search')) {
        $rules.innerHTML =
          '<input type="text" class="rules-search" id="rules-search"' +
          ' placeholder="Filter rules…" oninput="onRuleSearch(this.value)">' +
          '<div id="taxonomy-sections"></div>';
      }
      renderTaxonomySections();
    }

    function renderTaxonomySections() {
      const container = document.getElementById('taxonomy-sections');
      if (!container) return;

      if (!state.rules.length) {
        container.innerHTML = '<div class="empty-state"><p>No rules available</p></div>';
        return;
      }

      // Group rules by taxonomy
      const byTax = {};
      state.rules.forEach(r => {
        if (!byTax[r.taxonomy]) byTax[r.taxonomy] = [];
        byTax[r.taxonomy].push(r);
      });

      const q = state.ruleSearch.toLowerCase().trim();
      let html = '';

      for (const tax of ['lookup', 'regex', 'structural']) {
        const taxRules = byTax[tax] || [];
        if (!taxRules.length) continue;

        const taxDisabled = state.disabledTaxonomies.has(tax);
        // When a search is active, auto-expand all sections that have matches
        const isExpanded = state.expandedTaxonomies.has(tax) || q !== '';

        const filtered = q
          ? taxRules.filter(r =>
              r.rule_id.toLowerCase().includes(q) ||
              (r.ui_flag || '').toLowerCase().includes(q))
          : taxRules;

        const taxLabel = tax.charAt(0).toUpperCase() + tax.slice(1);

        html += '<div class="taxonomy-section">';
        html += '<div class="taxonomy-header">';
        html +=   '<button class="expand-btn' + (isExpanded ? ' expanded' : '') + '"' +
                  ' onclick="toggleTaxonomyExpand(\'' + tax + '\')"' +
                  ' title="' + (isExpanded ? 'Collapse' : 'Expand') + ' ' + taxLabel + '">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"' +
                  ' stroke-linecap="round" stroke-linejoin="round">' +
                  '<polyline points="9 18 15 12 9 6"/></svg>' +
                  '</button>';
        html +=   '<label class="taxonomy-label">' +
                  '<input type="checkbox" class="taxonomy-checkbox"' +
                  (taxDisabled ? '' : ' checked') +
                  ' onchange="toggleTaxonomy(\'' + tax + '\', this.checked)">' +
                  '<span>' + taxLabel + '</span>' +
                  '</label>';
        html +=   '<span class="taxonomy-count">' + taxRules.length + '</span>';
        html += '</div>'; // taxonomy-header

        if (isExpanded) {
          html += '<div class="taxonomy-rules">';
          if (filtered.length) {
            filtered.forEach(r => {
              const ruleDisabled = state.disabledRuleIds.has(r.rule_id);
              html +=
                '<label class="rule-item' + (taxDisabled ? ' tax-disabled' : '') + '">' +
                '<input type="checkbox"' +
                (ruleDisabled ? '' : ' checked') +
                (taxDisabled ? ' disabled' : '') +
                ' onchange="toggleRule(\'' + escHtml(r.rule_id) + '\', this.checked)">' +
                '<span class="rule-flag">' + escHtml(r.ui_flag || r.rule_id) + '</span>' +
                '</label>';
            });
          } else {
            html += '<div class="no-matches">No rules match &ldquo;' + escHtml(state.ruleSearch) + '&rdquo;</div>';
          }
          html += '</div>'; // taxonomy-rules
        }

        html += '</div>'; // taxonomy-section
      }

      container.innerHTML = html;
    }

    function onRuleSearch(q) {
      state.ruleSearch = q;
      renderTaxonomySections();
    }

    function toggleTaxonomyExpand(tax) {
      if (state.expandedTaxonomies.has(tax)) {
        state.expandedTaxonomies.delete(tax);
      } else {
        state.expandedTaxonomies.add(tax);
      }
      renderTaxonomySections();
    }

    // enabled=true  → taxonomy was checked   → remove from disabled set
    // enabled=false → taxonomy was unchecked → add to disabled set
    function toggleTaxonomy(tax, enabled) {
      if (enabled) {
        state.disabledTaxonomies.delete(tax);
      } else {
        state.disabledTaxonomies.add(tax);
      }
      saveState();
      renderTaxonomySections();
      runCheck();
    }

    // enabled=true  → rule was checked   → remove from disabled set
    // enabled=false → rule was unchecked → add to disabled set
    function toggleRule(ruleId, enabled) {
      if (enabled) {
        state.disabledRuleIds.delete(ruleId);
      } else {
        state.disabledRuleIds.add(ruleId);
      }
      saveState();
      renderTaxonomySections();
      runCheck();
    }

    // ── Loading / status ───────────────────────────────────────────────
    function setChecking(on) {
      state.checking = on;
      $status.innerHTML = on
        ? '<div class="spinner"></div> Checking...'
        : '';
    }

    // ── Banner ─────────────────────────────────────────────────────────
    function showBanner(msg, type) {
      $banner.textContent = msg;
      $banner.className = 'banner ' + type;
    }

    function hideBanner() {
      $banner.className = 'banner hidden';
    }

    // ── Utilities ──────────────────────────────────────────────────────
    function escHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Start ──────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
